services:
  sync-server:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SYNC_BIND: 0.0.0.0
      SYNC_PORT: 8787
      SYNC_DATA_DIR: /data
    ports:
      - 127.0.0.1:8787:8787
    volumes:
      - sync-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8787/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  sync-data:
